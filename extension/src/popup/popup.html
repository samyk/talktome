<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TalkToMe</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="brand-lockup">
          <div class="brand-icon">
            <img src="../assets/icons/icon128.png" alt="" />
          </div>
          <div>
            <div class="brand">TalkToMe</div>
            <div class="tagline">Natural voice, any page</div>
          </div>
        </div>
        <div id="engine" class="pill">…</div>
      </header>
      <p id="status" class="status">Connecting to TalkToMe…</p>
      <div class="actions">
        <button id="play-page" class="primary"><span class="play-mark">▶</span> Play page</button>
        <button id="play-selection">Selection</button>
        <button id="toggle">Play / Pause</button>
      </div>
      <div class="controls-card">
        <label class="field">
          <span>Engine</span>
          <select id="engine-select"></select>
        </label>
        <label class="field">
          <span>Speed</span>
          <select id="speed"></select>
        </label>
        <label class="field">
          <span>Voice</span>
          <select id="voice"></select>
        </label>
      </div>
      <div class="footer">
        <a href="#" id="options">Settings</a>
        <a href="#" id="library">Library</a>
      </div>
    </div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
