[project]
name = "listen-tts-server"
version = "0.1.0"
description = "Local neural TTS companion for the TalkToMe browser extension"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "aiofiles>=24.1.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
  "kokoro-onnx>=0.4.0",
  "onnxruntime>=1.20.0",
  "edge-tts>=6.1.0",
]

[project.optional-dependencies]
editx = [
  # Install Step-Audio-EditX separately; these are helpers only.
  "torchaudio>=2.4.0",
]

[project.scripts]
listen-tts = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
